{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<p class="sub">Changes are saved directly to config.py.</p>
<div class="card">
    <form method="post">
        <label>Similarity threshold (0-1, higher = stricter)</label>
        <input type="text" name="threshold" value="{{ threshold }}">

        <label>Alert cooldown (seconds before re-alerting on same person)</label>
        <input type="number" name="cooldown" value="{{ cooldown }}">

        <label>Camera index (0 = default webcam)</label>
        <input type="number" name="camera_index" value="{{ camera_index }}">

        <label><input type="checkbox" name="enable_telegram" {% if enable_telegram %}checked{% endif %} style="width:auto;display:inline-block;"> Enable Telegram alerts</label>

        <label>Telegram bot token</label>
        <input type="text" name="telegram_token" value="{{ telegram_token }}">

        <label>Telegram chat ID</label>
        <input type="text" name="telegram_chat_id" value="{{ telegram_chat_id }}">

        <button type="submit">Save Settings</button>
    </form>
</div>
{% if saved %}
<p class="status-green">Settings saved to config.py.</p>
{% endif %}
{% endblock %}
